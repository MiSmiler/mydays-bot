<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mydays-bot</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <ol id="messages" role="list" aria-label="Conversation"></ol>
      <form id="prompt-form">
        <textarea id="prompt" aria-label="Message" placeholder="Write a message…" rows="4" required></textarea>
        <div class="prompt-actions">
          <p id="session-status" role="status">Connecting...</p>
          <button type="submit" disabled>Send</button>
        </div>
      </form>
      <p id="notice" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
